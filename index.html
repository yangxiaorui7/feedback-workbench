<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#1c2333">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="需求收集工作台">
<meta name="mobile-web-app-capable" content="yes">
<title>需求收集工作台</title>
<style>
:root{
  --red:#e02424;--ink:#1c2333;--sub:#6b7385;--line:#e3e6ee;
  --bg:#eef0f5;--card:#fff;--soft:#f6f7fb;--blue:#3b6ef6;--green:#1faf77;
  --orange:#cf7413;--purple:#5b4fd0;--radius:12px;
  --shadow:0 2px 8px rgba(28,35,51,.06);--shadow-lg:0 8px 32px rgba(28,35,51,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:14px}
input,select,textarea,button{font-family:inherit;font-size:14px}
input[type="text"],input[type="date"],input[type="url"],textarea,select{font-size:16px}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cfd6e8;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* === Top Nav === */
.topnav{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);padding:0 20px;display:flex;align-items:center;gap:16px;height:56px;flex-wrap:wrap}
.topnav .logo{font-size:15px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px}
.topnav .logo svg{width:22px;height:22px;flex:none}
.nav-tabs{display:flex;gap:4px;flex:1}
.nav-tab{padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid transparent;background:none;color:var(--sub);transition:.15s;user-select:none;white-space:nowrap}
.nav-tab:hover{background:var(--soft)}
.nav-tab.active{background:var(--ink);color:#fff;font-weight:600}
.nav-tab .badge{display:inline-block;background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;text-align:center;line-height:16px;padding:0 4px;margin-left:4px;font-weight:700}
.sync-status{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--sub);cursor:pointer;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);transition:.15s}
.sync-status:hover{background:var(--soft)}
.sync-dot{width:8px;height:8px;border-radius:50%;flex:none}
.sync-dot.online{background:var(--green)}
.sync-dot.offline{background:var(--red)}
.sync-dot.syncing{background:var(--orange);animation:pulse 1s infinite}
.sync-dot.noserver{background:#cfd6e8}

/* === Content === */
.content{padding:16px;max-width:1400px;margin:0 auto;padding-bottom:80px}
.page{display:none}
.page.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* === Cards === */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title .sub{font-size:12px;color:var(--sub);font-weight:400}

/* === Buttons === */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.15s;user-select:none;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.pri:hover{background:#2a3450}
.btn.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn.icon{padding:6px;width:32px;height:32px;justify-content:center}

/* === Form === */
.input,.select,textarea.input{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:16px;background:var(--card);color:var(--ink);width:100%;outline:none;transition:.15s}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,110,246,.1)}
textarea.input{resize:vertical;min-height:60px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:var(--sub);font-weight:600}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.field-row{grid-template-columns:1fr}}

/* === Pills === */
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.pill.bug{background:#ffeceb;color:#d0302a}
.pill.req{background:#eaf2ff;color:#2f62d8}
.pill.idea{background:#eefbf4;color:#148a5a}
.pill.data{background:#fff4e6;color:#cf7413}
.pill.other{background:#f1f2f6;color:#7a8194}
.pill.lv0{background:#fdeaea;color:#c02121}
.pill.lv1{background:#fff1de;color:#cf7413}
.pill.lv2{background:#eef3ff;color:#4163d6}
.pill.lv3{background:#f1f2f6;color:#7a8194}
.pill.st0{background:#fdeaea;color:#c02121}
.pill.st1{background:#fff3dd;color:#c07a10}
.pill.st2{background:#e6f4ff;color:#1c7fd8}
.pill.st3{background:#eafbf0;color:#148a5a}
.pill.st4{background:#e9e7fb;color:#5b4fd0}
.pill.st5{background:#f1f2f6;color:#7a8194}

/* === KPI Cards === */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:11px;color:var(--sub)}
.kpi .k-val{font-size:24px;font-weight:800;margin-top:2px}
.kpi .k-val.red{color:var(--red)}
.kpi .k-val.green{color:var(--green)}
.kpi .k-val.blue{color:var(--blue)}
.kpi .k-val.orange{color:var(--orange)}

/* === Charts === */
.charts-row{display:grid;gap:12px;margin-bottom:16px}
.charts-row.c3{grid-template-columns:1.2fr 1fr 1.2fr}
.charts-row.c2{grid-template-columns:1fr 1fr}
@media(max-width:768px){.charts-row.c3,.charts-row.c2{grid-template-columns:1fr}}
.chart-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.chart-box .c-title{font-size:13px;font-weight:700;margin-bottom:8px}
.chart-box .c-body{min-height:100px;display:flex;align-items:center;justify-content:center}
.chart-legend{font-size:11px;color:var(--sub);margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chart-legend span{display:inline-flex;align-items:center;gap:4px}
.chart-legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.chart-empty{color:#c9d2e8;font-size:12px;text-align:center;padding:20px}

/* === Filter Bar === */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filter-bar select,.filter-bar input{padding:6px 10px;font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);outline:none}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--blue)}
.filter-bar .search{flex:1;min-width:140px}
.filter-bar .result-count{font-size:12px;color:var(--sub);margin-left:auto;white-space:nowrap}

/* === Table === */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table.records{width:100%;border-collapse:collapse;min-width:1200px}
table.records th{background:var(--soft);font-size:11px;color:var(--sub);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.records td{padding:7px 10px;font-size:12px;border-bottom:1px solid #f0f1f5;vertical-align:middle;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.records tr:hover td{background:#f8f9fc}
table.records td.editable{cursor:text}
table.records td.editable:hover{background:#eef3ff}
table.records .op-btns{display:flex;gap:4px;white-space:nowrap}
table.records .op-btns button{padding:3px 6px;font-size:11px;border-radius:5px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--sub)}
table.records .op-btns button:hover{background:var(--soft);color:var(--ink)}
.img-mini{width:28px;height:22px;border-radius:4px;border:1px solid #dfe3ef;background:linear-gradient(135deg,#cfd6e8,#eef1f8);display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#7c85a0;margin-right:2px;vertical-align:middle;cursor:pointer;position:relative}
.img-mini .count{position:absolute;top:-4px;right:-4px;background:var(--blue);color:#fff;font-size:8px;border-radius:6px;padding:0 3px;line-height:12px}

/* === Mobile Cards === */
.rec-cards{display:none;flex-direction:column;gap:10px}
.rec-card-m{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.rec-card-m .rcm-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.rec-card-m .rcm-title{font-size:14px;font-weight:600;color:var(--ink)}
.rec-card-m .rcm-meta{font-size:11px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rec-card-m .rcm-desc{font-size:12px;color:var(--sub);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec-card-m .rcm-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.rec-card-m .rcm-actions{display:flex;gap:6px;margin-top:8px}
@media(max-width:768px){.table-wrap{display:none}.rec-cards{display:flex}}

/* === Today Items === */
.today-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;background:var(--card);box-shadow:var(--shadow);transition:.15s}
.today-item:hover{box-shadow:var(--shadow-lg)}
.today-item.due{border-color:#ffc9c9;background:#fff6f6}
.today-item .dot{width:8px;height:8px;border-radius:50%;flex:none}
.today-item .dot.red{background:var(--red);animation:pulse 2s infinite}
.today-item .dot.green{background:var(--green)}
.today-item .dot.orange{background:var(--orange)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.today-item .ti-text{flex:1;font-size:12px;min-width:0}
.today-item .ti-text b{font-size:13px;display:block;margin-bottom:2px}
.today-item .ti-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}

/* === Paste Area === */
.paste-zone{border:2px dashed #c9d2e8;border-radius:var(--radius);background:var(--soft);padding:24px;text-align:center;color:var(--sub);transition:.15s;cursor:pointer}
.paste-zone:hover,.paste-zone.dragover{border-color:var(--blue);background:#f0f4ff}
.paste-zone b{color:var(--ink)}
.paste-zone .kbd{background:#fff;border:1px solid #cfd6e6;border-radius:5px;padding:2px 8px;font-weight:700;color:var(--ink);font-size:12px}

/* === Thumbnails === */
.thumb-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{width:72px;height:56px;border-radius:8px;border:1px solid var(--line);overflow:hidden;position:relative;cursor:pointer;background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .del{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.thumb.add{display:flex;align-items:center;justify-content:center;font-size:24px;color:#b9c4de;border-style:dashed}

/* === AI Output === */
.ai-out{border:1px dashed #b9c4de;background:#f7f9ff;border-radius:8px;padding:10px;margin-top:8px;font-size:12px;color:#44506e;line-height:1.6}
.ai-out .ai-label{color:var(--blue);font-weight:600}

/* === Modal === */
.modal-bg{position:fixed;inset:0;background:rgba(28,35,51,.45);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal-bg.show{display:flex;animation:fade .15s}
.modal{background:var(--card);border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);margin:auto}
.modal-hd{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;z-index:5;border-radius:16px 16px 0 0}
.modal-hd h3{font-size:16px;font-weight:700}
.modal-bd{padding:16px 20px}
.modal-ft{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;justify-content:flex-end;border-radius:0 0 16px 16px}
.modal-close{width:32px;height:32px;border:none;background:none;font-size:20px;color:var(--sub);cursor:pointer;border-radius:8px}
.modal-close:hover{background:var(--soft)}

/* === Detail grid === */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.detail-grid{grid-template-columns:1fr}}
.detail-full{grid-column:1/-1}

/* === FAB === */
.fab{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:13px 20px;border-radius:40px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(28,35,51,.28);z-index:40;cursor:pointer;display:flex;align-items:center;gap:8px;border:none;transition:.15s}
.fab:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(28,35,51,.32)}
.fab .fab-badge{background:var(--red);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;text-align:center;line-height:18px;padding:0 5px}
@media(max-width:768px){.fab{bottom:72px;right:16px;padding:11px 16px;font-size:12px}}

/* === Bottom Nav === */
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav .bn-list{display:flex}
.bottomnav .bn-item{flex:1;padding:6px 4px 8px;text-align:center;font-size:10px;background:none;border:none;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.bottomnav .bn-item.active{color:var(--blue);font-weight:600}
.bottomnav .bn-item svg{width:22px;height:22px}
@media(max-width:768px){.bottomnav{display:block}.content{padding-bottom:72px}.sync-status{padding:2px 6px;font-size:10px}}

/* === Toast === */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:200;transition:.3s;pointer-events:none;box-shadow:var(--shadow-lg);max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}

/* === Misc === */
.section-h{font-size:14px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between}
.section-h .sub{font-size:12px;color:var(--sub);font-weight:400}
.empty-state{text-align:center;padding:40px 20px;color:var(--sub)}
.empty-state svg{width:48px;height:48px;margin-bottom:8px;opacity:.3}
.empty-state p{font-size:13px}
.divider{height:1px;background:var(--line);margin:12px 0}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.settings-section{margin-bottom:20px}
.settings-section h3{font-size:14px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.help-list{font-size:12px;color:var(--sub);line-height:1.8;padding-left:16px}
.help-list li{margin-bottom:4px}
.paste-modal-area{border:2px dashed #c9d2e8;border-radius:var(--radius);background:var(--soft);padding:20px;text-align:center;color:var(--sub);min-height:120px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;cursor:pointer;transition:.15s}
.paste-modal-area:hover{border-color:var(--blue);background:#f0f4ff}
.paste-modal-area.has-content{border-style:solid;border-color:var(--line);background:var(--card);text-align:left;align-items:flex-start}
.overdue-badge{background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
</style>
</head>
<body>

<!-- Top Nav -->
<header class="topnav">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    需求收集工作台
  </div>
  <nav class="nav-tabs" id="navTabs">
    <button class="nav-tab active" data-page="today">今日处理<span class="badge" id="todayBadge" style="display:none">0</span></button>
    <button class="nav-tab" data-page="records">记录总表</button>
    <button class="nav-tab" data-page="quick">速记录入</button>
    <button class="nav-tab" data-page="dashboard">数据看板</button>
    <button class="nav-tab" data-page="settings">设置</button>
  </nav>
  <div class="sync-status" id="syncIndicator" onclick="switchPage('settings')" title="点击设置同步">
    <span class="sync-dot noserver" id="syncDot"></span>
    <span id="syncLabel">未配置</span>
  </div>
</header>

<!-- Content -->
<div class="content">
  <div class="page active" id="page-today"></div>
  <div class="page" id="page-records"></div>
  <div class="page" id="page-quick"></div>
  <div class="page" id="page-dashboard"></div>
  <div class="page" id="page-settings"></div>
</div>

<!-- Bottom Nav -->
<nav class="bottomnav">
  <div class="bn-list" id="bnList">
    <button class="bn-item active" data-page="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      今日
    </button>
    <button class="bn-item" data-page="records">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      总表
    </button>
    <button class="bn-item" data-page="quick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      速记
    </button>
    <button class="bn-item" data-page="dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
      看板
    </button>
    <button class="bn-item" data-page="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 01-.1 1.3l2 1.5-2 3.5-2.4-1a7 7 0 01-2.2 1.3l-.4 2.5H8.1l-.4-2.5a7 7 0 01-2.2-1.3l-2.4 1-2-3.5 2-1.5A7 7 0 013 12a7 7 0 01.1-1.3l-2-1.5 2-3.5 2.4 1a7 7 0 012.2-1.3L7.9 3h4.2l.4 2.5a7 7 0 012.2 1.3l2.4-1 2 3.5-2 1.5A7 7 0 0119 12z"/></svg>
      设置
    </button>
  </div>
</nav>

<!-- FAB -->
<button class="fab" id="fab">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
  粘贴速记
  <span class="fab-badge" id="fabBadge" style="display:none">0</span>
</button>

<!-- Modal: Detail -->
<div class="modal-bg" id="modalDetail">
  <div class="modal" id="modalDetailInner"></div>
</div>

<!-- Modal: Quick Paste -->
<div class="modal-bg" id="modalPaste">
  <div class="modal" id="modalPasteInner"></div>
</div>

<!-- Modal: Export -->
<div class="modal-bg" id="modalExport">
  <div class="modal" id="modalExportInner"></div>
</div>

<!-- Modal: Image Preview -->
<div class="modal-bg" id="modalImg" onclick="closeImgModal()">

/* === AI ENGINE === */
var AI = {
  extract: function(rawDesc){
    if(!rawDesc || !rawDesc.trim()) return null;
    var type = this.genType(rawDesc);
    var level = this.genLevel(rawDesc);
    var proposer = this.genProposer(rawDesc);
    return {
      title: this.genTitle(rawDesc),
      type: type,
      level: level,
      proposer: proposer,
      summary: this.genSummary(rawDesc, proposer),
      aiLogic: this.genLogic(type),
      pmAnalysis: this.genPM(type, level, proposer),
    };
  },
  
  genTitle: function(desc){
    var lines = desc.split('\n').filter(function(l){ return l.trim(); });
    var firstLine = lines[0] || '';
    var text = firstLine.replace(/^[（(]?\s*\S+?\s*[）)]?\s*[:：]\s*/, '');
    text = text.replace(/^(今天|刚才|顺便)?(说|提到|反馈|问|希望|建议|能否|可以)?/,'');
    var punct = text.search(/[，。！？,.!?;；\s\n]/);
    if(punct>0 && punct<=12){ text = text.slice(0,punct); }
    if(!text) text = firstLine.slice(0,10);
    return text.slice(0,10) || '新记录';
  },
  
  genType: function(desc){
    if(/bug|报错|异常|错误|崩溃|闪退|为空|不对|无法|失败|不能|丢失|不显示|不准确/.test(desc)) return 'BUG';
    if(/希望|建议|新增|优化|能否|可以|需要|想要|应该|支持/.test(desc)) return '需求';
    if(/想法|考虑|也许|可能|或许|是否可以|思考/.test(desc)) return '想法';
    if(/数据|导出|导入|统计|报表|处理|去重|清洗/.test(desc)) return '数据处理';
    return '其他';
  },
  
  genLevel: function(desc){
    if(/崩溃|闪退|数据丢失|不能用|全部|无法登录|系统挂|白屏/.test(desc)) return '致命';
    if(/紧急|严重|影响|马上|立刻|尽快|今天|未来时间/.test(desc)) return '紧急';
    if(/重要|需要|应该|影响|希望/.test(desc)) return '重要';
    return '一般';
  },
  
  genSummary: function(desc, proposer){
    var lines = desc.split('\n').filter(function(l){ return l.trim(); });
    var first = lines.find(function(l){ return l.replace(/^[（(]?\s*\S+\s*[）)]?\s*[:：]\s*/, '').trim(); }) || lines[0] || '';
    var text = first.replace(/^[（(]?\s*\S+\s*[）)]?\s*[:：]\s*/, '');
    if(text.length>80) text = text.slice(0,80)+'...';
    return (proposer ? proposer+'反馈：' : '') + text;
  },
  
  genLogic: function(type){
    var templates = {
      'BUG': '1. 复现问题，定位异常代码位置\n2. 分析根因（数据/逻辑/接口）\n3. 修复并添加防护逻辑\n4. 回归测试验证',
      '需求': '1. 明确需求边界与交互流程\n2. 评估技术方案与工作量\n3. 设计UI原型\n4. 开发实现并联调',
      '想法': '1. 调研可行性\n2. 评估优先级与投入产出\n3. 如可行，细化需求并排期',
      '数据处理': '1. 确认数据源与口径\n2. 编写处理脚本\n3. 验证数据准确性\n4. 上线并监控',
      '其他': '1. 了解具体场景\n2. 分析问题本质\n3. 制定处理方案'
    };
    return templates[type] || templates['其他'];
  },
  
  genPM: function(type, level, proposer){
    var parts = [];
    parts.push('类型：'+type+' · 级别：'+level);
    if(proposer) parts.push('提出人：'+proposer);
    parts.push('日期：'+U.today());
    if(type==='BUG' && (level==='致命'||level==='紧急')){
      parts.push('建议：立即转开发，优先处理');
    }else if(type==='需求'){
      parts.push('建议：排期评审，确认优先级');
    }else if(type==='数据处理'){
      parts.push('建议：确认数据口径后处理');
    }else{
      parts.push('建议：跟进确认，适时处理');
    }
    return parts.join('\n');
  },
  
  genProposer: function(desc){
    var firstLine = desc.split('\n').find(function(l){ return l.trim(); }) || '';
    var m = firstLine.match(/^[（(]?\s*([\u4e00-\u9fa5a-zA-Z][\u4e00-\u9fa5a-zA-Z0-9]{0,5})\s*[）)]?\s*[:：]/);
    if(m) return m[1];
    return '';
  }
};

/* === IMAGE UTILS === */
var ImgU = {
  compress: function(dataURL, maxW, cb){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      try{
        var out = canvas.toDataURL('image/jpeg', 0.7);
        cb(out);
      }catch(e){ cb(dataURL); }
    };
    img.onerror = function(){ cb(dataURL); };
    img.src = dataURL;
  },
  
  fromFile: function(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      ImgU.compress(e.target.result, 800, cb);
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }
};

/* === CHARTS === */
var Charts = {
  donut: function(data, size){
    var total = data.reduce(function(s,d){ return s+d.value; }, 0);
    if(total===0) return '<div class="chart-empty">暂无数据</div>';
    var r = size/2 - 12;
    var cx = size/2, cy = size/2;
    var C = 2 * Math.PI * r;
    var offset = 0;
    var segs = '';
    var legend = '';
    data.forEach(function(d, i){
      if(d.value===0) return;
      var len = (d.value/total) * C;
      segs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+d.color+'" stroke-width="16" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
      offset += len;
      var pct = Math.round(d.value/total*100);
      legend += '<span><i style="background:'+d.color+'"></i>'+U.escape(d.label)+' '+pct+'%</span>';
    });
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><svg viewBox="0 0 '+size+' '+size+'" style="width:'+size+'px;height:'+size+'px;max-width:100%">'+segs+'<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="16" font-weight="700" fill="#1c2333">'+total+'</text><text x="'+cx+'" y="'+(cy+14)+'" text-anchor="middle" font-size="9" fill="#6b7385">总计</text></svg><div class="chart-legend">'+legend+'</div></div>';
  },
  
  bar: function(data, height){
    var max = Math.max.apply(null, data.map(function(d){ return d.value; }).concat([1]));
    var n = data.length;
    var barW = n > 0 ? 100/n : 0;
    var bars = '';
    data.forEach(function(d, i){
      var h = (d.value/max) * (height - 28);
      bars += '<rect x="'+(i*barW + barW*0.15)+'%" y="'+(height-20-h)+'" width="'+(barW*0.7)+'%" height="'+h+'" fill="'+d.color+'" rx="4"/>';
      if(d.value>0) bars += '<text x="'+(i*barW + barW/2)+'%" y="'+(height-20-h-3)+'" text-anchor="middle" font-size="9" fill="#1c2333" font-weight="700">'+d.value+'</text>';
      bars += '<text x="'+(i*barW + barW/2)+'%" y="'+(height-6)+'" text-anchor="middle" font-size="8" fill="#6b7385">'+U.escape(d.label)+'</text>';
    });
    return '<svg viewBox="0 0 100 '+height+'" style="width:100%;height:'+height+'px" preserveAspectRatio="none">'+bars+'</svg>';
  },
  
  line: function(data, height){
    if(data.length===0) return '<div class="chart-empty">暂无数据</div>';
    var max = Math.max.apply(null, data.map(function(d){ return d.value; }).concat([1]));
    var W = 200, H = height;
    var step = data.length > 1 ? W/(data.length-1) : 0;
    var pts = data.map(function(d, i){ return (i*step)+','+(H-20-(d.value/max)*(H-30)); }).join(' ');
    var circles = '';
    var labels = '';
    data.forEach(function(d, i){
      var x = i*step, y = H-20-(d.value/max)*(H-30);
      circles += '<circle cx="'+x+'" cy="'+y+'" r="3" fill="'+(d.value===max && max>0 ? '#e02424' : '#3b6ef6')+'"/>';
      labels += '<text x="'+x+'" y="'+(H-6)+'" text-anchor="middle" font-size="7" fill="#6b7385">'+U.escape(d.label)+'</text>';
    });
    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px" preserveAspectRatio="xMidYMid meet"><polyline points="'+pts+'" fill="none" stroke="#3b6ef6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+circles+labels+'</svg>';
  }
};

var IO = {
  toCSV: function(records){
    var headers = ['提出日期','原始描述','标题','类型','级别','状态','提出人','系统功能页面','总结提炼','AI实现逻辑','PM分析','关联名称','关联链接','提醒日期','登记平台号','来源','截图数'];

    var lines = [headers.map(function(h){ return '"'+h+'"'; }).join(',')];
    records.forEach(function(r){
      lines.push(keys.map(function(k){
        var v = r[k];
        if(k==='imgs') v = (v||[]).length;
        v = v || '';
        v = String(v).replace(/"/g,'""').replace(/\n/g,' ');
        return '"'+v+'"';
      }).join(','));
    });
    return '\ufeff'+lines.join('\n');
  },
  
  toXLS: function(records){
    var headers = ['提出日期','原始描述','标题','类型','级别','状态','提出人','系统功能页面','总结提炼','AI实现逻辑','PM分析','关联名称','关联链接','提醒日期','登记平台号','来源','截图数'];
    var keys = ['raiseDate','rawDesc','title','type','level','status','proposer','sysModule','summary','aiLogic','pmAnalysis','relName','relUrl','remindAt','platformNo','source','imgs'];
    var html = '<table border="1"><tr>';
    headers.forEach(function(h){ html += '<th style="background:#1c2333;color:#fff">'+U.escape(h)+'</th>'; });
    html += '</tr>';
    records.forEach(function(r){
      html += '<tr>';
      keys.forEach(function(k){
        var v = r[k];
        if(k==='imgs') v = (v||[]).length;
        v = v || '';
        html += '<td>'+U.escape(String(v)).replace(/\n/g,'<br>')+'</td>';
      });
      html += '</tr>';
    });
    html += '</table>';
    return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="UTF-8"></head><body>'+html+'</body></html>';
  },
  
  toJSON: function(){
    return JSON.stringify({ version:2, exportedAt:U.now(), records:Store.records }, null, 2);
  },
  
  download: function(filename, content, mime){
    var blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 100);
  },
  
  parseCSV: function(text){
    text = text.replace(/^\ufeff/, '');
    var rows = [];
    var row = [], cell = '', inQ = false;
    for(var i=0; i<text.length; i++){
      var c = text[i];
      if(inQ){
        if(c==='"'){
          if(text[i+1]==='"'){ cell+='"'; i++; }
          else inQ = false;
        }else cell += c;
      }else{
        if(c==='"') inQ = true;
        else if(c===','){ row.push(cell); cell=''; }
        else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
        else if(c==='\r'){}
        else cell += c;
      }
    }
    if(cell || row.length){ row.push(cell); rows.push(row); }
    return rows;
  },
  
  importCSV: function(text){
    var rows = this.parseCSV(text);
    if(rows.length < 2) return { count:0, error:'CSV 文件为空或格式不正确' };
    var headers = rows[0];
    var count = 0;
    for(var i=1; i<rows.length; i++){
      var r = rows[i];
      if(!r.filter(function(c){ return c.trim(); }).length) continue;
      var rec = {
        id: U.uid(), createdAt: U.now(),
        raiseDate: r[0] || U.today(),
        rawDesc: r[1] || '',
        title: r[2] || AI.genTitle(r[1] || ''),
        type: r[3] || AI.genType(r[1] || ''),
        level: r[4] || '一般',
        status: this.mapStatus(r[5]),
        proposer: r[6] || '',
        sysModule: r[7] || '',
        summary: r[8] || AI.genSummary(r[1] || '', r[6] || ''),
        aiLogic: r[9] || AI.genLogic(r[3] || '其他'),
        pmAnalysis: r[10] || '',
        relName: r[11] || '',
        relUrl: r[12] || '',
        remindAt: r[13] || '',
        platformNo: r[14] || '',
        source: r[15] || '其他',
        imgs: []
      };
      Store.records.unshift(rec);
      count++;
    }
    Store.save();
    return { count: count };
  },
  
  mapStatus: function(s){
    if(!s) return '待处理';
    s = s.trim();
    if(/已处理|已解决|已实现|完成|done|fixed/.test(s)) return '已解决';
    if(/转开发|升级|已登记|登记|platform/.test(s)) return '已登记平台';
    if(/处理中|进行|开发|in.progress|working/.test(s)) return '处理中';
    if(/验证|待验/.test(s)) return '待验证';
    if(/关闭|取消|无效|closed|cancel/.test(s)) return '已关闭';
    return '待处理';
  },
  
  importJSON: function(text){
    var data = JSON.parse(text);
    var recs = data.records || data;
    if(!Array.isArray(recs)) return { count:0, error:'JSON 格式不正确' };
    var count = 0;
    recs.forEach(function(r){
      if(!r.id) r.id = U.uid();
      if(!r.createdAt) r.createdAt = U.now();
      if(!r.imgs) r.imgs = [];
      Store.records.unshift(r);
      count++;
    });
    Store.save();
    return { count: count };
  },
  
  template: function(){
    return '提出日期,原始描述,标题,类型,级别,状态,提出人,系统功能页面,总结提炼,AI实现逻辑,PM分析,关联名称,关联链接,提醒日期,登记平台号,来源,截图数\n' +
      '2026-09-10,张三：这里粘贴企微对话原文,AI自动提炼标题,BUG,紧急,待处理,张三,系统>模块>页面,AI总结,AI实现逻辑,PM分析,,,2026-09-17,,企微同事,0\n';
  }
};

/* ============================================================
   CLOUD SYNC MODULE
   ============================================================ */
var Sync = {
  serverUrl: '',
  autoSync: true,
  pushTimer: null,
  pullTimer: null,
  lastSyncAt: null,
  status: 'noserver',
  
  config: function(){
    try{
      var c = JSON.parse(localStorage.getItem(SYNC_KEY) || '{}');
      this.serverUrl = c.serverUrl || '';
      this.autoSync = c.autoSync !== false;
      return c;
    }catch(e){ return {}; }
  },
  
  saveConfig: function(url, autoSync){
    this.serverUrl = url;
    this.autoSync = autoSync;
    localStorage.setItem(SYNC_KEY, JSON.stringify({ serverUrl: url, autoSync: autoSync }));
  },
  
  init: function(){
    this.config();
    if(this.serverUrl){
      this.setStatus('offline');
      this.pull();
      if(this.autoSync){
        this.startAutoPull();
      }
    }else{
      this.setStatus('noserver');
    }
  },
  
  setStatus: function(status){
    this.status = status;
    var dot = document.getElementById('syncDot');
    var label = document.getElementById('syncLabel');
    if(!dot || !label) return;
    dot.className = 'sync-dot ' + status;
    switch(status){
      case 'online': label.textContent = '已同步'; break;
      case 'offline': label.textContent = '未连接'; break;
      case 'syncing': label.textContent = '同步中…'; break;
      case 'noserver': label.textContent = '未配置'; break;
      default: label.textContent = status;
    }
  },
  
  test: function(url, cb){
    var self = this;
    var fullUrl = (url || this.serverUrl).replace(/\/$/,'') + '/api/ping';
    try{
      fetch(fullUrl, { method:'GET', cache:'no-cache' })
        .then(function(r){ return r.json(); })
        .then(function(data){
          if(data.ok){
            self.setStatus('online');
            cb(true, '连接成功');
          }else{
            self.setStatus('offline');
            cb(false, '服务器返回异常');
          }
        })
        .catch(function(err){
          self.setStatus('offline');
          cb(false, '连接失败: ' + err.message);
        });
    }catch(e){
      cb(false, '请求异常: ' + e.message);
    }
  },
  
  pull: function(){
    var self = this;
    if(!this.serverUrl) return;
    this.setStatus('syncing');
    var url = this.serverUrl.replace(/\/$/,'') + '/api/records';
    try{
      fetch(url, { method:'GET', cache:'no-cache' })
        .then(function(r){ return r.json(); })
        .then(function(data){
          var remoteRecs = data.records || [];
          if(remoteRecs.length > 0){
            self.merge(remoteRecs);
          }
          self.lastSyncAt = new Date().toISOString();
          self.setStatus('online');
        })
        .catch(function(err){
          self.setStatus('offline');
        });
    }catch(e){
      self.setStatus('offline');
    }
  },
  
  push: function(){
    var self = this;
    if(!this.serverUrl || !this.autoSync) return;
    this.setStatus('syncing');
    var url = this.serverUrl.replace(/\/$/,'') + '/api/records';
    try{
      fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ records: Store.records })
      })
        .then(function(r){ return r.json(); })
        .then(function(data){
          self.lastSyncAt = new Date().toISOString();
          self.setStatus('online');
        })
        .catch(function(err){
          self.setStatus('offline');
        });
    }catch(e){
      self.setStatus('offline');
    }
  },
  
  debouncedPush: function(){
    if(!this.serverUrl || !this.autoSync) return;
    var self = this;
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(function(){ self.push(); }, 1000);
  },
  
  startAutoPull: function(){
    var self = this;
    clearInterval(this.pullTimer);
    this.pullTimer = setInterval(function(){ self.pull(); }, 30000);
  },
  
  stopAutoPull: function(){
    clearInterval(this.pullTimer);
  },
  
  merge: function(remoteRecs){
    var localMap = {};
    Store.records.forEach(function(r){ localMap[r.id] = r; });
    var changed = false;
    remoteRecs.forEach(function(r){
      var local = localMap[r.id];
      if(!local){
        Store.records.push(r);
        changed = true;
      }else{
        var localT = local.updatedAt || local.createdAt || '';
        var remoteT = r.updatedAt || r.createdAt || '';
        if(remoteT > localT){
          Object.assign(local, r);
          changed = true;
        }
      }
    });
    if(changed){
      localStorage.setItem(RECORDS_KEY, JSON.stringify(Store.records));
      if(currentPage) renderPage(currentPage);
    }
  },
  
  forceSync: function(){
    this.pull();
    var self = this;
    setTimeout(function(){ self.push(); }, 500);
  }
};

  if(!result){ U.toast('无法从描述中提炼信息','error'); return; }
  
  if(result.proposer) document.getElementById('qProposer').value = result.proposer;
  if(result.type) document.getElementById('qType').value = result.type;
  if(result.level) document.getElementById('qLevel').value = result.level;
  
  var h = '<div class="ai-out">';

function handleImgUpload(e){
  var files = e.target.files;
  var remain = 9 - editingImages.length;
  if(remain <= 0){ U.toast('最多9张图片','error'); return; }
  var toProcess = Array.prototype.slice.call(files, 0, remain);
  var done = 0;
  toProcess.forEach(function(f){
    ImgU.fromFile(f, function(dataURL){
      if(dataURL){ editingImages.push(dataURL); }
      done++;
      if(done === toProcess.length){ updateThumbs(); if(files.length > remain) U.toast('最多9张，已上传'+remain+'张','error'); }
    });
  });
  e.target.value = '';
}

function updateThumbs(){
  var row = document.getElementById('thumbRow');
  if(!row) return;
  var h = '';
  editingImages.forEach(function(img, i){
    h += '<div class="thumb"><img src="'+img+'" onclick="previewImg(\''+i+'\')"><button class="del" onclick="event.stopPropagation();removeImg('+i+')">×</button></div>';
  });
  if(editingImages.length < 9){
    h += '<div class="thumb add" onclick="document.getElementById(\'imgUpload\').click()">+</div>';
  }
  row.innerHTML = h;
  var hint = document.getElementById('imgHint');
  if(hint) hint.textContent = editingImages.length + '/9 张';
}

function removeImg(i){
  editingImages.splice(i, 1);
  updateThumbs();
}

function previewImg(i){
  var img = editingImages[i];
  if(img){
    document.getElementById('imgPreview').src = img;
    document.getElementById('modalImg').classList.add('show');
  }
}

function closeImgModal(){
  document.getElementById('modalImg').classList.remove('show');
}

function doExport(fmt){
  var range = document.getElementById('exportRange').value;
  var recs;
  var fname;
  if(range === 'filtered'){
    recs = Store.getFiltered();
    fname = '需求记录_筛选_'+U.today();
  }else if(range === 'month'){
    var m = document.getElementById('exportMonth').value;
    recs = Store.records.filter(function(r){ return U.monthKey(r.raiseDate)===m; });
    fname = '需求记录_'+m.replace('-','')+'_'+U.today();
  }else{
    recs = Store.records;
    fname = '需求记录_全量_'+U.today();
  }
  if(!recs || recs.length===0){ U.toast('没有可导出的记录','error'); return; }
  if(fmt === 'xls'){
    IO.download(fname+'.xls', IO.toXLS(recs), 'application/vnd.ms-excel');
  }else if(fmt === 'csv'){
    IO.download(fname+'.csv', IO.toCSV(recs), 'text/csv;charset=utf-8');
  }else if(fmt === 'json'){
    IO.download(fname+'.json', JSON.stringify({version:2,exportedAt:U.now(),records:recs},null,2), 'application/json');
  }
  closeModal('modalExport');
  U.toast('已导出 '+recs.length+' 条记录','success');
}

/* ============================================================
   INLINE EDITING
   ============================================================ */
function inlineEdit(td, id, field, type, options){
  var rec = Store.getById(id);
  if(!rec) return;
  var oldVal = td.innerHTML;
  var val = rec[field] || '';
  var input;
  if(type === 'select'){
    input = document.createElement('select');
    input.className = 'input';
    input.style.fontSize = '12px';
    input.style.padding = '2px 4px';
    input.style.width = '100%';
    options.forEach(function(o){
      var opt = document.createElement('option');
      opt.value = o; opt.textContent = o;
      if(o === val) opt.selected = true;
      input.appendChild(opt);
    });
  }else if(type === 'date'){
    input = document.createElement('input');
    input.type = 'date';
    input.className = 'input';
    input.style.fontSize = '12px';
    input.style.padding = '2px 4px';
    input.value = val;
  }else{
    input = document.createElement('input');
    input.type = 'text';
    input.className = 'input';
    input.style.fontSize = '12px';
    input.style.padding = '2px 4px';
    input.style.width = '100%';
    input.value = val;
  }
  td.innerHTML = '';
  td.appendChild(input);
  input.focus();
  if(input.select) input.select();
  
  function save(){
    var newVal = input.value;
    if(newVal !== val){
      var update = {}; update[field] = newVal;
      Store.update(id, update);
      if(field === 'status' && newVal === '已登记平台' && !rec.platformNo){
        U.toast('提示：可填写登记平台号','success');
      }
    }
    renderPage(currentPage);
  }
  function cancel(){ td.innerHTML = oldVal; }
  
  input.addEventListener('blur', save);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); save(); }
    else if(e.key === 'Escape'){ e.preventDefault(); cancel(); }
  });
  input.addEventListener('change', save);
}

function aiFillAll(){

  Store.records.forEach(function(r){
    if(!r.title || r.title === '新记录' || !r.summary || !r.aiLogic){
      var result = AI.extract(r.rawDesc);
      if(result){
        if(!r.title || r.title === '新记录') r.title = result.title;
        if(!r.type || r.type === '其他') r.type = result.type;
        if(!r.level || r.level === '一般') r.level = result.level;
        if(!r.summary) r.summary = result.summary;
        if(!r.aiLogic) r.aiLogic = result.aiLogic;
        if(!r.pmAnalysis) r.pmAnalysis = result.pmAnalysis;
        if(!r.proposer) r.proposer = result.proposer;
        count++;
      }
    }
  });
  Store.save();
  if(count > 0){
    U.toast('已为 '+count+' 条记录补充 AI 字段','success');
    renderRecords();
  }else{
    U.toast('所有记录已完善，无需补充');

function handleImport(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var text = ev.target.result;
    var result;
    try{
      if(file.name.endsWith('.json')){
        result = IO.importJSON(text);
      }else{
        result = IO.importCSV(text);
      }
      if(result.error){
        U.toast('导入失败：'+result.error,'error');
      }else{
        U.toast('成功导入 '+result.count+' 条记录','success');
        renderPage(currentPage);
      }
    }catch(err){
      U.toast('导入失败：'+err.message,'error');
    }
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}

/* ============================================================
   GLOBAL PASTE HANDLER
   ============================================================ */
document.addEventListener('paste', function(e){
  var active = document.activeElement;
  var inInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT');
  
  if(currentPage === 'quick' && active && active.id === 'rawInput'){
    var items0 = e.clipboardData ? e.clipboardData.items : [];
    for(var i=0; i<items0.length; i++){
      if(items0[i].type.indexOf('image') >= 0){
        e.preventDefault();
        var blob0 = items0[i].getAsFile();
        ImgU.fromFile(blob0, function(dataURL){
          if(dataURL){
            editingImages.push(dataURL);
            updateThumbs();
            U.toast('图片已添加','success');
          }
        });
        return;
      }
    }
    return;
  }
  
  if(inInput) return;
  
  var clipText = '';
  var clipImages = [];
  var items = e.clipboardData ? e.clipboardData.items : [];
  
  for(var j=0; j<items.length; j++){
    if(items[j].type.indexOf('image') >= 0){
      clipImages.push(items[j].getAsFile());
    }
  }
  
  if(e.clipboardData && e.clipboardData.getData){
    clipText = e.clipboardData.getData('text/plain') || '';
  }
  
  if(!clipText && clipImages.length === 0) return;
  
  e.preventDefault();
  openQuickPaste();
  
  setTimeout(function(){
    if(clipText){
      var ta = document.getElementById('pasteRaw');
      if(ta){ ta.value = clipText; onPasteInput(); }
    }
    if(clipImages.length > 0){
      var remain = 9 - pasteImages.length;
      clipImages.slice(0, remain).forEach(function(blob){
        ImgU.fromFile(blob, function(dataURL){
          if(dataURL){
            pasteImages.push(dataURL);
            var tr = document.getElementById('pasteThumbs');
            if(tr){
              var div = document.createElement('div');
              div.className = 'thumb';
              div.innerHTML = '<img src="'+dataURL+'">';
              tr.appendChild(div);
            }
          }
        });
      });
    }
  }, 200);
});

/* ============================================================
   INIT
   ============================================================ */
function init(){
  Store.load();
  
  document.getElementById('navTabs').addEventListener('click', function(e){
    var t = e.target.closest('.nav-tab');
    if(t) switchPage(t.dataset.page);
  });
  
  document.getElementById('bnList').addEventListener('click', function(e){
    var t = e.target.closest('.bn-item');
    if(t) switchPage(t.dataset.page);
  });
  
  document.getElementById('fab').addEventListener('click', function(){
    openQuickPaste();
  });
  
  ['modalDetail','modalPaste','modalExport'].forEach(function(id){
    document.getElementById(id).addEventListener('click', function(e){
      if(e.target === this) closeModal(id);
    });
  });
  
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){
      document.querySelectorAll('.modal-bg.show').forEach(function(m){
        m.classList.remove('show');
      });
    }
  });
  
  renderToday();
  Sync.init();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}
</script>
</body>
